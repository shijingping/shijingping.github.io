<title>TASK 01 // MATRIX CALCULATOR — JERMAIN C ENGO</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ef;--ink:#171717;--muted:#77766f;--line:#deddd6;--card:#fff;--accent:#6955e8;--soft:#eae7ff;--dark:#17171d;--mono:"DM Mono",monospace;--body:"Manrope",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}a{color:inherit;text-decoration:none}.nav{height:76px;padding:0 6vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand,.nav a,.eyebrow,.meta,.label,.chip,.footer{font-family:var(--mono)}.brand{font-size:12px;letter-spacing:1.5px;font-weight:500}.nav-links{display:flex;gap:22px;font-size:12px;color:var(--muted)}.nav-links a:hover{color:var(--accent)}.wrap{width:min(1120px,88vw);margin:auto}.hero{padding:70px 0 28px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,82px);line-height:.98;letter-spacing:-5px;margin:18px 0 16px;font-weight:800}.hero h1 span{color:var(--accent)}.intro{max-width:650px;color:var(--muted);font-size:15px;line-height:1.8}.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.chip{font-size:10px;padding:8px 11px;border:1px solid var(--line);border-radius:99px;background:#ffffff90}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;padding:24px 0 75px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:25px;min-width:0;box-shadow:0 8px 30px #24201808;transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-4px);box-shadow:0 18px 38px #24201812}.overview{grid-column:span 7;min-height:250px}.objective{grid-column:span 5;background:var(--soft);border-color:#d8d1ff}.process{grid-column:span 4}.logic{grid-column:span 4;background:var(--dark);color:white;border-color:var(--dark)}.output{grid-column:span 4}.resources{grid-column:span 7;background:#e9eee8;border-color:#dce4da}.reflection{grid-column:span 5}.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:24px}.label{font-size:10px;letter-spacing:1.3px;color:var(--muted)}.number{font:500 11px var(--mono);color:var(--accent)}h2{font-size:21px;letter-spacing:-.7px;margin:0 0 12px}p{line-height:1.75}.card p{font-size:13px;color:var(--muted);margin:0}.objective p{color:#625b82}.metric{font-size:clamp(44px,6vw,66px);font-weight:800;letter-spacing:-4px;margin:14px 0 3px}.metric small{font-size:15px;letter-spacing:0;color:var(--muted);font-weight:600}.mini-list{padding-left:18px;margin:0;color:var(--muted);font-size:12px;line-height:2}.logic p{color:#b9b9c4}.logic .label{color:#aaa8ba}.logic .logic-line{font:12px/2 var(--mono);color:#c7bdff;margin-top:12px}.terminal{background:#101116;color:#e9e9ef;border-radius:13px;padding:16px;font:11px/1.9 var(--mono);overflow:auto;white-space:pre}.terminal .dim{color:#8b8b99}.terminal .hi{color:#b7aaff}.resource-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.resource-links a{display:inline-flex;padding:11px 14px;border-radius:99px;background:var(--ink);color:white;font:10px var(--mono);transition:.2s}.resource-links a.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.resource-links a:hover{background:var(--accent);color:white}.footer{border-top:1px solid var(--line);padding:24px 6vw;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--muted)}.footer a{color:var(--accent)}
@media(max-width:760px){.nav{height:65px}.nav-links{gap:12px;font-size:10px}.hero{padding-top:48px}.hero h1{letter-spacing:-3px}.grid{grid-template-columns:1fr}.card,.overview,.objective,.process,.logic,.output,.resources,.reflection{grid-column:1}.card{padding:21px}.footer{line-height:1.8}}


/* THEME: 3D INTERACTIVE — single active visual system */
:root{
 --bg:#050a18;--panel:rgba(10,22,48,.88);--ink:#f3f8ff;--text:#f3f8ff;
 --muted:#a8b8d2;--cyan:#55eaff;--pink:#9b83ff;--violet:#684dff;
 --accent:#55eaff;--line:rgba(85,234,255,.28);--soft:rgba(104,77,255,.2);
 --dark:rgba(4,10,25,.92);
}
html,body{background:#050a18!important;color:var(--ink)}
body{
 background:
  radial-gradient(ellipse at 16% 10%,rgba(0,170,255,.2),transparent 32%),
  radial-gradient(ellipse at 84% 24%,rgba(104,77,255,.23),transparent 34%),
  linear-gradient(145deg,#050a18 0%,#08152e 52%,#080b20 100%)!important;
 background-attachment:fixed!important;
}
body:before{
 content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.22;
 background-image:linear-gradient(rgba(85,234,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(85,234,255,.12) 1px,transparent 1px);
 background-size:58px 58px;transform:perspective(700px) rotateX(62deg) scale(1.8);transform-origin:center bottom;
 mask-image:linear-gradient(to bottom,transparent 8%,black 90%);
}
.site-header,.topbar,.nav{
 background:rgba(4,10,26,.88)!important;border-bottom:1px solid var(--line)!important;
 backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
 box-shadow:0 12px 35px rgba(0,0,0,.28);
}
.brand-mark,.archive-seal,.about-stamp{border-color:var(--cyan)!important;color:var(--cyan)!important;box-shadow:0 0 24px rgba(85,234,255,.22),inset 0 0 18px rgba(85,234,255,.08)}
.nav-links a:hover,.top-actions a:hover,.backline a,.footer a,.back-top{color:var(--cyan)!important;text-shadow:0 0 14px rgba(85,234,255,.5)}
.eyebrow,.prompt,.filebar,.terminal-title,.hero-meta strong,.output-head,.number,.label,.crest-live{color:var(--cyan)!important}
h1,h2,h3,.hero h1{color:var(--ink)}
h2 span,.outline-text,.hero h1 span,.glow{color:#a99aff!important;text-shadow:0 0 24px rgba(139,112,255,.42)}
.hero-visual,.hero-grid,.arsenal-grid,.lab-grid,.file-grid,.grid{perspective:1200px}
.crest-card,.terminal-window,.file-card,.output,.filebar,.card,.arsenal-card,.lab-card,.contact-panel,.about-stamp,.profile-stats div{
 background:linear-gradient(145deg,rgba(24,48,91,.9),rgba(6,16,39,.94))!important;
 border:1px solid rgba(85,190,255,.38)!important;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 22px 52px rgba(0,0,0,.42),0 0 26px rgba(35,160,255,.1);
 backdrop-filter:blur(16px) saturate(145%);-webkit-backdrop-filter:blur(16px) saturate(145%);
 transform-style:preserve-3d;
}
.crest-card{transform:rotateY(-9deg) rotateX(5deg);transition:transform .55s ease,box-shadow .55s ease}
.hero-visual:hover .crest-card{transform:rotateY(7deg) rotateX(-3deg) translateY(-9px);box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 42px rgba(85,234,255,.2)}
.orbit{border-color:rgba(85,234,255,.4)!important;box-shadow:0 0 20px rgba(85,234,255,.12);animation:orbit3d 10s ease-in-out infinite}
.orbit-two{border-color:rgba(155,131,255,.55)!important;animation-delay:-5s}
@keyframes orbit3d{0%,100%{transform:rotate(-25deg) translateY(0)}50%{transform:rotate(-14deg) translateY(-15px)}}
.floating-tag,.status,.chip,.tags span,.tag-row span{
 background:rgba(5,18,43,.9)!important;border:1px solid rgba(85,234,255,.48)!important;color:var(--cyan)!important;
 box-shadow:0 10px 28px rgba(0,0,0,.28),0 0 18px rgba(85,234,255,.1);
}
.btn,.btn-primary,.file-links a,.resource-links a,.resource-links a.secondary,.tool-button{
 border:1px solid rgba(85,234,255,.48)!important;border-radius:12px!important;
 background:linear-gradient(125deg,rgba(13,127,184,.42),rgba(91,67,190,.5))!important;color:#effaff!important;
 box-shadow:0 9px 26px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.14);
 transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease,filter .3s ease;
}
.btn-primary,.file-links a:first-child,.resource-links a:first-child{
 background:linear-gradient(110deg,#43eaff,#7487ff 58%,#a17aff)!important;color:#061126!important;
}
.btn:hover,.btn-primary:hover,.file-links a:hover,.resource-links a:hover,.tool-button:hover{
 transform:translateY(-5px) perspective(600px) rotateX(5deg)!important;
 border-color:#a18cff!important;box-shadow:0 18px 38px rgba(0,0,0,.38),0 0 26px rgba(85,234,255,.22);filter:brightness(1.1);
}
.arsenal-card,.lab-card,.file-card,.card{transition:transform .38s ease,border-color .38s ease,box-shadow .38s ease}
.arsenal-card:hover,.lab-card:hover,.file-card:hover,.card:hover{
 transform:translateY(-10px) rotateX(3deg) rotateY(-2deg)!important;
 border-color:rgba(85,234,255,.8)!important;
 box-shadow:0 28px 60px rgba(0,0,0,.45),0 0 34px rgba(85,234,255,.16)!important;
}
.arsenal-icon,.file-icon,.crest-symbol{color:var(--cyan)!important;text-shadow:0 0 22px rgba(85,234,255,.58)}
.tag-row span,.tags span{color:#c0b3ff!important;border-color:rgba(155,131,255,.58)!important}
.quote-section{background:radial-gradient(ellipse at center,rgba(44,105,190,.24),transparent 65%),rgba(4,10,25,.72)!important;border-color:var(--line)!important}
.progress-bar{background:linear-gradient(90deg,#55eaff,#7186ff,#a17aff)!important;box-shadow:0 0 16px #55eaff}
.scanlines{opacity:.025!important}.noise{opacity:.02!important}
.terminal,.output,.output-head{background-color:rgba(3,10,26,.9)!important;border-color:var(--line)!important}
.terminal .hi,pre{color:#9cecff!important}
.footer,.site-footer{background:rgba(4,10,25,.88)!important;border-color:var(--line)!important;color:var(--muted)!important}
.crest-card,.terminal-window{animation:coreFloat 7s ease-in-out infinite}
@keyframes coreFloat{0%,100%{filter:drop-shadow(0 0 8px rgba(85,234,255,.06))}50%{filter:drop-shadow(0 0 20px rgba(125,103,255,.18))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
